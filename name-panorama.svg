  </g>
  <g font-family="monospace" fill="#141414" font-size="54" font-weight="700">
    <text x="120" y="835">INTERFACES → SYSTEMS → BUSINESS VALUE</text>
    <text x="3770" y="790">DESIGN / BUILD / TEST / SHIP</text>
